<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IRON CLOCK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1f1f1f;
    --accent: #e8ff47;
    --accent-dim: rgba(232, 255, 71, 0.12);
    --text-primary: #f0f0f0;
    --text-muted: #555;
    --red: #ff4747;
    --red-dim: rgba(255, 71, 71, 0.15);
    --radius: 16px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    /* Safe area for iPhone notch/home bar */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px 24px;
    overflow: hidden;
    max-width: 430px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .app-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--text-muted);
  }

  .reset-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    background: var(--border);
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .reset-btn:active { color: var(--red); border-color: var(--red); }

  /* ── WORKOUT CLOCK ── */
  .workout-clock {
    background: var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border: 1px solid #1a1a1a;
  }

  .wc-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .wc-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 0.06em;
    color: var(--text-primary);
    line-height: 1;
  }

  .wc-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .wc-dot.active {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ── SET COUNTER ── */
  .set-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .set-label {
    font-size: 9px;
    letter-spacing: 0.35em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0;
  }

  .set-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 110px;
    line-height: 0.9;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .set-number.pop { transform: scale(1.12); }

  .set-sublabel {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* ── DIVIDER ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  /* ── REST TIMER ── */
  .rest-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .rest-label {
    font-size: 9px;
    letter-spacing: 0.35em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .ring-wrap {
    position: relative;
    width: 150px;
    height: 150px;
    flex-shrink: 0;
  }

  .ring-wrap svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
  }

  .ring-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 5;
  }

  .ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 408;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }
  .ring-fill.resting { stroke: var(--accent); }

  .ring-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .ring-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    letter-spacing: 0.04em;
    color: var(--text-primary);
    transition: color 0.3s;
  }
  .ring-time.done { color: var(--accent); }

  .ring-unit {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Duration controls */
  .duration-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .dur-btn {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--border);
    border: 1px solid #252525;
    border-radius: 10px;
    padding: 9px 16px;
    cursor: pointer;
    letter-spacing: 0.05em;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s, border-color 0.15s, opacity 0.15s;
  }
  .dur-btn:active { color: var(--accent); border-color: var(--accent); }
  .dur-btn:disabled { opacity: 0.3; pointer-events: none; }

  .dur-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.08em;
    color: var(--text-primary);
    min-width: 52px;
    text-align: center;
  }

  /* ── CTA BUTTONS ── */
  .cta-row {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }

  .btn-start {
    flex: 1;
    background: var(--accent);
    color: #0a0a0a;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.15em;
    border: none;
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(232,255,71,0.15);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-start:active { transform: scale(0.97); box-shadow: none; }
  .btn-start.resting {
    background: var(--red);
    box-shadow: 0 0 30px rgba(255,71,71,0.2);
  }

  .btn-skip {
    background: var(--border);
    color: var(--text-muted);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.15em;
    border: 1px solid #252525;
    border-radius: 14px;
    padding: 20px 22px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s, border-color 0.15s, transform 0.1s;
    opacity: 0.4;
    pointer-events: none;
  }
  .btn-skip.active {
    opacity: 1;
    pointer-events: all;
    color: var(--text-muted);
  }
  .btn-skip.active:active { transform: scale(0.97); color: var(--red); border-color: var(--red); }

  /* ── SOUND TOGGLE ── */
  .sound-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    flex-shrink: 0;
  }

  .sound-icon { font-size: 13px; }

  .sound-label {
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .toggle {
    width: 32px;
    height: 18px;
    background: var(--accent);
    border-radius: 9px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .toggle.off { background: var(--border); border: 1px solid #2a2a2a; }

  .toggle::after {
    content: '';
    position: absolute;
    right: 3px;
    top: 3px;
    width: 12px;
    height: 12px;
    background: #0a0a0a;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.off::after {
    transform: translateX(-14px);
    background: var(--text-muted);
  }

  /* ── FLASH OVERLAY ── */
  .flash {
    position: fixed;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.1s;
  }
  .flash.show { opacity: 0.15; }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<div class="screen">

  <!-- Top bar -->
  <div class="top-bar">
    <span class="app-label">IRON CLOCK</span>
    <button class="reset-btn" id="resetBtn" onclick="resetAll()">RESET</button>
  </div>

  <!-- Workout total clock -->
  <div class="workout-clock">
    <div>
      <div class="wc-label">Total Workout</div>
      <div class="wc-time" id="workoutTime">00:00:00</div>
    </div>
    <div class="wc-dot" id="wcDot"></div>
  </div>

  <!-- Set counter -->
  <div class="set-section">
    <div class="set-label">Completed</div>
    <div class="set-number" id="setNumber">0</div>
    <div class="set-sublabel">sets</div>
  </div>

  <div class="divider"></div>

  <!-- Rest timer -->
  <div class="rest-section">
    <div class="rest-label">Rest Timer</div>

    <div class="ring-wrap">
      <svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
        <circle class="ring-bg" cx="75" cy="75" r="65"/>
        <circle class="ring-fill" id="ringFill" cx="75" cy="75" r="65"/>
      </svg>
      <div class="ring-inner">
        <div class="ring-time" id="ringTime">1:30</div>
        <div class="ring-unit" id="ringUnit">duration</div>
      </div>
    </div>

    <div class="duration-row">
      <button class="dur-btn" id="durMinus" onclick="adjustDuration(-30)">− 30s</button>
      <div class="dur-value" id="durValue">1:30</div>
      <button class="dur-btn" id="durPlus" onclick="adjustDuration(30)">+ 30s</button>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta-row">
    <button class="btn-start" id="startBtn" onclick="handleStart()">START REST</button>
    <button class="btn-skip" id="skipBtn" onclick="skipRest()">SKIP</button>
  </div>

  <!-- Sound toggle -->
  <div class="sound-row">
    <span class="sound-icon">🔔</span>
    <span class="sound-label">Alert on finish</span>
    <div class="toggle" id="soundToggle" onclick="toggleSound()"></div>
  </div>

</div>

<script>
  // ── STATE ──
  let sets = 0;
  let restDuration = 90;      // seconds
  let restRemaining = 90;
  let restActive = false;
  let workoutStartTime = null;
  let soundOn = true;

  let restInterval = null;
  let workoutInterval = null;

  const CIRCUMFERENCE = 2 * Math.PI * 65; // ~408.4

  // ── DOM REFS ──
  const setNumberEl   = document.getElementById('setNumber');
  const workoutTimeEl = document.getElementById('workoutTime');
  const wcDot         = document.getElementById('wcDot');
  const ringFill      = document.getElementById('ringFill');
  const ringTimeEl    = document.getElementById('ringTime');
  const ringUnitEl    = document.getElementById('ringUnit');
  const durValueEl    = document.getElementById('durValue');
  const durMinus      = document.getElementById('durMinus');
  const durPlus       = document.getElementById('durPlus');
  const startBtn      = document.getElementById('startBtn');
  const skipBtn       = document.getElementById('skipBtn');
  const soundToggle   = document.getElementById('soundToggle');
  const flash         = document.getElementById('flash');

  // ── AUDIO (Web Audio API — works in Safari) ──
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playAlert() {
    if (!soundOn) return;
    try {
      const ctx = getAudioCtx();
      // Three ascending beeps
      const times = [0, 0.22, 0.44];
      const freqs = [880, 1100, 1320];
      times.forEach((t, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freqs[i];
        gain.gain.setValueAtTime(0, ctx.currentTime + t);
        gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.18);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.2);
      });
    } catch(e) {}
  }

  // ── HELPERS ──
  function formatTime(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
    return `${pad(m)}:${pad(s)}`;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatMSS(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${pad(s)}`;
  }

  function updateRing(remaining, total) {
    const progress = total > 0 ? remaining / total : 1;
    const offset = CIRCUMFERENCE * (1 - progress);
    ringFill.style.strokeDasharray = CIRCUMFERENCE;
    ringFill.style.strokeDashoffset = offset;
  }

  function setDurButtons() {
    durMinus.disabled = restActive || restDuration <= 30;
    durPlus.disabled  = restActive;
  }

  function popSet() {
    setNumberEl.classList.remove('pop');
    void setNumberEl.offsetWidth;
    setNumberEl.classList.add('pop');
    setTimeout(() => setNumberEl.classList.remove('pop'), 200);
  }

  function flashScreen() {
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 180);
  }

  // ── WORKOUT CLOCK ──
  function startWorkoutClock() {
    if (workoutInterval) return;
    workoutStartTime = Date.now();
    wcDot.classList.add('active');
    workoutInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - workoutStartTime) / 1000);
      workoutTimeEl.textContent = formatTime(elapsed).length === 5
        ? '00:' + formatTime(elapsed)
        : formatTime(elapsed);
      // Always show HH:MM:SS
      const h = Math.floor(elapsed / 3600);
      const m = Math.floor((elapsed % 3600) / 60);
      const s = elapsed % 60;
      workoutTimeEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    }, 1000);
  }

  // ── MAIN ACTIONS ──
  function handleStart() {
    // Unlock audio on first interaction
    try { getAudioCtx().resume(); } catch(e) {}

    if (!restActive) {
      // Increment set
      sets++;
      setNumberEl.textContent = sets;
      popSet();

      // Start workout clock on first set
      if (sets === 1) startWorkoutClock();

      // Start rest countdown
      restRemaining = restDuration;
      restActive = true;

      startBtn.textContent = 'RESTING...';
      startBtn.classList.add('resting');
      skipBtn.classList.add('active');
      ringUnitEl.textContent = 'remaining';

      setDurButtons();
      updateRing(restRemaining, restDuration);

      restInterval = setInterval(() => {
        restRemaining--;
        ringTimeEl.textContent = formatMSS(restRemaining);
        updateRing(restRemaining, restDuration);

        if (restRemaining <= 0) {
          clearInterval(restInterval);
          restActive = false;
          ringTimeEl.classList.add('done');
          ringUnitEl.textContent = 'done!';
          startBtn.textContent = 'START REST';
          startBtn.classList.remove('resting');
          skipBtn.classList.remove('active');
          setDurButtons();
          playAlert();
          flashScreen();
          // Reset ring display after 2s
          setTimeout(() => {
            ringTimeEl.textContent = formatMSS(restDuration);
            ringTimeEl.classList.remove('done');
            ringUnitEl.textContent = 'duration';
            updateRing(restDuration, restDuration);
          }, 2000);
        } else {
          ringTimeEl.textContent = formatMSS(restRemaining);
        }
      }, 1000);
    }
  }

  function skipRest() {
    if (!restActive) return;
    clearInterval(restInterval);
    restActive = false;
    restRemaining = restDuration;

    startBtn.textContent = 'START REST';
    startBtn.classList.remove('resting');
    skipBtn.classList.remove('active');
    ringTimeEl.textContent = formatMSS(restDuration);
    ringTimeEl.classList.remove('done');
    ringUnitEl.textContent = 'duration';
    updateRing(restDuration, restDuration);
    setDurButtons();
  }

  function adjustDuration(delta) {
    if (restActive) return;
    restDuration = Math.max(30, restDuration + delta);
    restRemaining = restDuration;
    durValueEl.textContent = formatMSS(restDuration);
    ringTimeEl.textContent = formatMSS(restDuration);
    updateRing(restDuration, restDuration);
    setDurButtons();
  }

  function resetAll() {
    clearInterval(restInterval);
    clearInterval(workoutInterval);
    restInterval = null;
    workoutInterval = null;
    workoutStartTime = null;

    sets = 0;
    restActive = false;
    restRemaining = restDuration;

    setNumberEl.textContent = '0';
    workoutTimeEl.textContent = '00:00:00';
    wcDot.classList.remove('active');
    ringTimeEl.textContent = formatMSS(restDuration);
    ringTimeEl.classList.remove('done');
    ringUnitEl.textContent = 'duration';
    startBtn.textContent = 'START REST';
    startBtn.classList.remove('resting');
    skipBtn.classList.remove('active');
    updateRing(restDuration, restDuration);
    setDurButtons();
  }

  function toggleSound() {
    soundOn = !soundOn;
    soundToggle.classList.toggle('off', !soundOn);
  }

  // ── INIT ──
  ringFill.style.strokeDasharray = CIRCUMFERENCE;
  ringFill.style.strokeDashoffset = 0;
  durValueEl.textContent = formatMSS(restDuration);
  ringTimeEl.textContent = formatMSS(restDuration);
  setDurButtons();
</script>
</body>
</html>
